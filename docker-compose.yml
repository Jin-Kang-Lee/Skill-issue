version: "3.9"

services:
  backend:
    build:
      context: ./server
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./server:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./client
    ports:
      - "3000:3000"
    depends_on:
      - backend
    # ❌ REMOVE THIS to stop overwriting /app
    # volumes:
    #   - ./client:/app
